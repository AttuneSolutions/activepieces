name: Publish Yoke piece

# Publishes @attunesolutions/piece-yoke to npm when its version changes.
# The version in packages/pieces/community/yoke/package.json is the release
# trigger: bump it in a commit to main and this publishes; leave it alone and the
# job no-ops (npm versions are immutable, so re-publishing the same one fails).
# Upstream syncs never touch the piece path, so they never fire this.

on:
  push:
    branches: [main]
    paths:
      - packages/pieces/community/yoke/**
      - .github/workflows/publish-piece-yoke.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    if: github.repository == 'AttuneSolutions/activepieces'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 24 can ship older.
      - run: npm install -g npm@latest

      # Pinned to a SHA, not a tag: this job holds id-token: write and npm publish
      # rights, so a hijacked tag on a third-party action could mint an OIDC token
      # and publish under our scope. Bump deliberately.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install

      - name: Read piece name and version
        id: piece
        run: |
          cd packages/pieces/community/yoke
          echo "name=$(jq -r .name package.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already published
        id: published
        env:
          PIECE: ${{ steps.piece.outputs.name }}@${{ steps.piece.outputs.version }}
        run: |
          if npm view "$PIECE" version >/dev/null 2>&1; then
            echo "::notice::$PIECE is already on npm — nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        if: steps.published.outputs.exists == 'false'
        env:
          PIECE_NAME: ${{ steps.piece.outputs.name }}
        run: npx turbo run lint --filter="$PIECE_NAME"

      - name: Test
        if: steps.published.outputs.exists == 'false'
        working-directory: packages/pieces/community/yoke
        run: npx vitest run

      - name: Build bundle
        if: steps.published.outputs.exists == 'false'
        run: npm run build-piece yoke

      - name: Publish to npm
        if: steps.published.outputs.exists == 'false'
        working-directory: packages/pieces/community/yoke/dist
        # Auth comes from trusted publishing (OIDC) via id-token: write — no token.
        # Provenance is attached automatically.
        run: npm publish --access public

      - name: Summary
        if: steps.published.outputs.exists == 'false'
        env:
          PIECE: ${{ steps.piece.outputs.name }}@${{ steps.piece.outputs.version }}
        run: echo "Published $PIECE" >> "$GITHUB_STEP_SUMMARY"
